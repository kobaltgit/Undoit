name: Release

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Undoit v__VERSION__'
          releaseBody: |
            # 🚀 Undoit v2.1.1 — Иерархия папок и файлов / Folder Tree View

            ### 🇷🇺 Что нового в версии 2.1.1:
            * **Иерархический файловый обозреватель (Tree View)**: файловый список теперь отображает точную древовидную структуру папок и подпапок отслеживаемых каталогов.
            * **Гибкое управление узлами**: папки по умолчанию компактно закрыты, с сохранением состояния раскрытия; быстрые кнопки «Развернуть всё» и «Свернуть всё».
            * **Умный поиск по дереву**: при вводе запроса папки с совпадениями автоматически раскрываются.
            * **Два режима отображения**: мгновенное переключение между «Дерево» (структура каталогов) и «Список» (плоский хронологический список недавних файлов).
            * **Ручное управление релизами**: отключена автокомпиляция при пуше тегов, сборка запускается только по вызову.

            ---

            ### 🇬🇧 What's new in version 2.1.1:
            * **Folder Tree View**: the file explorer now mirrors the exact nested folder hierarchy of watched directories.
            * **Smart Node Management**: folders are collapsed by default with state persistence; quick "Expand all" and "Collapse all" controls.
            * **Search Auto-Expansion**: matching search queries automatically expand relevant parent folders.
            * **Dual Display Modes**: seamless toggle between "Tree" view and "List" (flat chronological) view.
            * **Manual Release Builds**: disabled automated tag compilation, builds are triggered on demand.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
