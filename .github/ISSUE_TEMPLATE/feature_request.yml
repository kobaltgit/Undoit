name: ✨ Предложение новой функции (Feature Request)
description: Предложите идею или улучшение для Undoit
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Есть классная идея по улучшению Undoit? Поделитесь ею!
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему или потребность решает это предложение?
      description: Кратко опишите контекст (например, «При работе с 3D-моделями неудобно...»).
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как вы видите работу этой функции в интерфейсе или системе?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативные варианты
      description: Рассматривали ли вы другие подходы?
